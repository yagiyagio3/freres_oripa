<title>くじ当たりボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@500;700;800&display=swap">
<style>
/* Layout: 横向き3分割 — 左ロゴ / 中央 分数ボード / 右 操作ボタン。縁日の福引台を思わせる藍と金。 */
:root {
  --bg: #16213a;          /* 藍 */
  --bg-deep: #0f1729;
  --panel: #fbf6ea;       /* 生成りの札 */
  --ink: #1b2440;
  --gold: #e3b450;
  --hit: #d8452f;         /* 当たり：朱 */
  --miss: #3f5a8a;        /* ハズレ：群青 */
  --muted: #8f9bb8;
  --line: rgba(227,180,80,.35);
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "M PLUS 1p", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 90% at 50% 40%, var(--bg) 0%, var(--bg-deep) 100%);
  background-color: var(--bg);
  color: var(--panel);
  font-family: var(--font-body);
  padding-inline: 16px;
  overflow: hidden;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: minmax(0, 1fr);
  align-items: center;
  box-sizing: border-box;
  gap: clamp(12px, 2.5vw, 32px);
  padding-block: clamp(12px, 3vh, 32px);
}

/* 左：ロゴ */
.logo {
  display: grid; place-items: center;
  height: 100%;
}
.logo-img {
  width: min(92%, 70vh);
  max-width: 100%;
  aspect-ratio: 1;
  object-fit: contain;
  filter: drop-shadow(0 10px 24px rgba(0,0,0,.45));
  -webkit-user-drag: none;
}
.logo-stage {
  position: relative;
  width: min(92%, 70vh);
  max-width: 100%;
  aspect-ratio: 1;
  filter: drop-shadow(0 10px 24px rgba(0,0,0,.45));
  -webkit-user-drag: none;
  pointer-events: none;
}
.logo-stage img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ls-clip { position: absolute; inset: 0; clip-path: circle(49.9% at 50% 50%); -webkit-clip-path: circle(49.9% at 50% 50%); overflow: hidden; }
.ls-bg { transform: scale(1.06); }
.ls-shine {
  position: absolute; inset: 0;
  background: linear-gradient(115deg, rgba(255,240,190,0) 42%, rgba(255,244,205,.55) 50%, rgba(255,240,190,0) 58%);
  background-size: 300% 100%;
  background-position: 120% 0;
  mix-blend-mode: screen;
}
.ls-star { position: absolute; width: 7%; aspect-ratio: 1; opacity: 0; }
.ls-star svg { width: 100%; height: 100%; display: block; }
.ls-star.s1 { left: 12%; top: 22%; }
.ls-star.s2 { left: 84%; top: 36%; width: 9%; }
.ls-star.s3 { left: 6%;  top: 62%; width: 5%; }
.ls-star.s4 { left: 72%; top: 17%; width: 5%; }
.ls-char { position: absolute; inset: 0; transform-origin: 50% 90%; }
.ls-hand { transform-origin: 18.75% 75%; }
@media (prefers-reduced-motion: no-preference) {
  .ls-bg { animation: lsBg 10s ease-in-out infinite alternate; }
  .ls-shine { animation: lsShine 5s ease-in-out infinite; }
  .ls-star { animation: lsStar 3.2s ease-in-out infinite; }
  .ls-star.s2 { animation-delay: .9s; }
  .ls-star.s3 { animation-delay: 1.7s; }
  .ls-star.s4 { animation-delay: 2.4s; }
  .ls-char { animation: lsBob 3.2s ease-in-out infinite; }
  .ls-hand { animation: lsWave 1.3s ease-in-out infinite; }
  @keyframes lsBg { from { transform: scale(1.06) translate(-1.2%, .8%); } to { transform: scale(1.09) translate(1.2%, -.8%); } }
  @keyframes lsShine { 0% { background-position: 120% 0; } 55%, 100% { background-position: -20% 0; } }
  @keyframes lsStar { 0%, 100% { opacity: 0; transform: scale(.3) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(45deg); } 70% { opacity: 0; transform: scale(.5) rotate(90deg); } }
  @keyframes lsBob { 0%, 100% { transform: translateY(0) rotate(0deg); } 30% { transform: translateY(-.9%) rotate(-.9deg); } 70% { transform: translateY(-.3%) rotate(.8deg); } }
  @keyframes lsWave { 0%, 100% { transform: rotate(-3.5deg); } 50% { transform: rotate(3deg); } }
}
.logo-dummy {
  width: min(80%, 34vh);
  aspect-ratio: 1; max-width: 100%;
  border: 3px dashed var(--line);
  border-radius: 50%;
  display: grid; place-items: center; align-content: center;
  gap: .4em;
  color: var(--gold);
  text-align: center;
}
.logo-dummy b { font-family: var(--font-display); font-size: clamp(22px, 4vw, 48px); font-weight: 400; letter-spacing: .08em; }
.logo-dummy small { color: var(--muted); font-size: clamp(10px, 1.2vw, 14px); letter-spacing: .1em; }

/* 中央：ボード */
.board {
  background: var(--panel);
  color: var(--ink);
  border-radius: 18px;
  border: 4px solid var(--gold);
  box-shadow: 0 0 0 6px var(--bg-deep), 0 0 0 8px var(--line), 0 20px 40px rgba(0,0,0,.4);
  padding: clamp(10px, 3vh, 32px) clamp(12px, 2vw, 28px);
  max-height: 100%; box-sizing: border-box; overflow: hidden;
  display: grid;
  grid-template-rows: auto auto auto;
  gap: clamp(8px, 2vh, 20px);
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.label {
  font-size: clamp(10px, 1.3vw, 15px);
  font-weight: 800;
  letter-spacing: .14em;
  color: #6a6f80;
}
.fraction { display: grid; justify-items: center; gap: clamp(2px, .6vh, 8px); }
.frac-row { white-space: nowrap; display: flex; align-items: baseline; justify-content: center; gap: .35em; }
.frac-num, .frac-den {
  font-family: var(--font-display);
  line-height: 1;
}
.frac-num { font-size: clamp(38px, min(11.5vw, 19vh), 160px); color: var(--hit); }
.frac-den { font-size: clamp(38px, min(11.5vw, 19vh), 160px); }
.frac-unit { font-size: clamp(11px, 1.4vw, 17px); font-weight: 700; color: #6a6f80; }
.frac-bar { width: 94%; height: 5px; border-radius: 3px; background: var(--ink); }
.divider { height: 0; border-top: 2px dotted #d6cdb4; }
.percent {
  font-family: var(--font-display);
  font-size: clamp(32px, min(8vw, 14vh), 112px);
  line-height: 1;
  white-space: nowrap;
}
.percent small { font-size: .45em; margin-left: .08em; }
.percent.empty { color: #b9b3a3; }

/* 右：ボタン */
.controls {
  display: grid;
  grid-template-rows: 1.4fr 1.4fr 1fr 1fr;
  gap: clamp(6px, 1.8vh, 16px);
  height: 100%;
  max-height: 100%;
  min-height: 0;
}
.controls > .btn { min-height: 0; }
.topbar { display: flex; justify-content: flex-end; }
.btn-full {
  display: inline-flex; align-items: center; gap: 4px;
  font: 700 12px var(--font-body); letter-spacing: .04em;
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 10px;
  cursor: pointer;
}
.btn-full svg { width: 14px; height: 14px; }
.btn-full:active { background: rgba(255,255,255,.08); }
.btn-full:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.toast {
  position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  max-width: calc(100% - 32px);
  background: var(--panel); color: var(--ink);
  border: 2px solid var(--gold); border-radius: 10px;
  padding: 8px 14px; font-size: 13px; font-weight: 700;
  z-index: 15;
}
.btn {
  font-family: var(--font-display);
  font-size: clamp(16px, min(3.4vw, 6vh), 40px);
  letter-spacing: .12em;
  border: none;
  border-radius: 14px;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 6px 0 rgba(0,0,0,.35);
  transition: transform .06s, box-shadow .06s, opacity .15s;
}
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn-hit { background: var(--hit); }
.btn-miss { background: var(--miss); }
.btn-sub {
  font-size: clamp(13px, min(2.2vw, 4vh), 26px);
  background: transparent;
  color: var(--panel);
  border: 2px solid var(--line);
  box-shadow: none;
}
.btn-sub:active { background: rgba(255,255,255,.06); }
.btn-gear { color: var(--gold); border-color: var(--gold); }

/* 設定ポップアップ */
.overlay {
  position: fixed; inset: 0;
  background: rgba(8,12,24,.7);
  display: grid; place-items: center;
  padding: 16px;
  z-index: 10;
}
.dialog {
  background: var(--panel); color: var(--ink);
  border-radius: 16px; border: 3px solid var(--gold);
  width: min(340px, 100%);
  box-sizing: border-box;
  max-height: 100%; overflow: auto;
  padding: clamp(14px, 2.5vh, 22px) 20px;
  display: grid; gap: 12px;
}
.dialog h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 20px; letter-spacing: .08em; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-weight: 800; font-size: 14px; }
.field input {
  width: 100%; min-width: 0; box-sizing: border-box;
  font: 700 20px var(--font-body);
  font-variant-numeric: tabular-nums;
  padding: 8px 12px;
  border: 2px solid #cfc6ad; border-radius: 10px;
  background: #fff; color: var(--ink);
  -webkit-user-select: text; user-select: text;
}
.field input:focus { outline: none; border-color: var(--hit); }
.error { color: var(--hit); font-size: 14px; font-weight: 700; min-height: 1.2em; margin: 0; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dbtn {
  min-width: 0; box-sizing: border-box;
  font: 800 15px var(--font-body); letter-spacing: .06em;
  padding: 9px 8px; border-radius: 8px; cursor: pointer;
}
.dbtn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.dbtn-cancel { background: transparent; border: 2px solid #b8b09a; color: var(--ink); }
.dbtn-ok { background: var(--ink); border: 2px solid var(--ink); color: #fff; }
.dbtn-full { background: var(--gold); border: 2px solid var(--gold); color: var(--ink); width: 100%; }
.note { margin: -4px 0 0; font-size: 13px; line-height: 1.5; color: #5b6075; }

/* 確認ポップアップ（リセット） */
.dialog p.msg { margin: 0; font-size: 16px; line-height: 1.6; }

/* 縦向き警告 */
.rotate {
  display: none;
  position: fixed; inset: 0; z-index: 20;
  background: var(--bg-deep);
  place-items: center; align-content: center;
  gap: 20px; text-align: center; padding: 24px;
}
.rotate svg { width: 96px; height: 96px; }
.rotate p { margin: 0; font-family: var(--font-display); font-size: clamp(20px, 5vw, 32px); color: var(--panel); letter-spacing: .06em; }
.rotate small { color: var(--muted); font-size: 15px; }
@media (orientation: portrait) {
  .rotate { display: grid; }
}
@media (prefers-reduced-motion: no-preference) {
  .rotate svg { animation: tilt 2.4s ease-in-out infinite; }
  @keyframes tilt { 0%,30% { transform: rotate(0) } 60%,100% { transform: rotate(-90deg) } }
  .bump { animation: bump .25s ease-out; }
  @keyframes bump { 0% { transform: scale(1.12) } 100% { transform: scale(1) } }
}

/* 夜景背景 */
#nightBg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; pointer-events: none; }
.app { position: relative; z-index: 1; }
.btn-sub { background: rgba(12, 18, 36, .55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.btn-sub:active { background: rgba(30, 40, 70, .7); }

/* 時計 */
.logo { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 2.5vh, 22px); }
.logo .logo-stage { width: min(92%, 58vh); }
.clock {

  color: var(--gold);
  font-variant-numeric: tabular-nums;

  padding: .18em .5em .2em;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(12, 18, 36, .55);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  white-space: nowrap;
  width: min(92%, 58vh);

  text-align: center;
  overflow: hidden;
}
.clock .colon { display: inline-block; width: .42em; text-align: center; }
.clock-t { display: inline-block; }

.label-main { font-size: clamp(15px, min(2.4vw, 4.4vh), 28px); letter-spacing: .16em; color: #4f5468; }
.label-sub { font-size: clamp(13px, min(1.9vw, 3.4vh), 22px); color: #555a6e; margin-bottom: calc(-1 * clamp(4px, 1.4vh, 14px)); }

<script>
(function () {
  var KEY = 'kuji-board-v1';
  // 初期値はサンプル（設定ボタンから変更してください）
  var state = { A: 100, B: 10, initA: 100, initB: 10 };

  try {
    var saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && Number.isInteger(saved.A) && Number.isInteger(saved.B)) state = saved;
  } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };
  var elA = $('numA'), elB = $('numB'), elC = $('numC');

  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function percentText(a, b) {
    if (a <= 0) return null;
    // 小数第2位を四捨五入して第1位まで
    var v = Math.round((b / a) * 1000) / 10;
    return v.toFixed(1);
  }

  function bump(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

  // 数値が枠の幅からはみ出す場合だけ縮小する
  var board = document.querySelector('.board');
  function fitOne(target, row) {
    target.style.fontSize = '';
    var cs = getComputedStyle(board);
    var avail = board.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var rg = document.createRange(); rg.selectNodeContents(row);
    var need = rg.getBoundingClientRect().width;
    if (need > avail * 0.96) {
      var size = parseFloat(getComputedStyle(target).fontSize);
      target.style.fontSize = (size * avail * 0.96 / need).toFixed(2) + 'px';
    }
  }
  function fitAll() {
    // 数値Aと数値Bは常に同じサイズ（はみ出す方に合わせて両方縮小）
    fitOne(elB, elB.parentNode); fitOne(elA, elA.parentNode); fitOne(elC, elC);
    var sa = parseFloat(getComputedStyle(elA).fontSize), sb = parseFloat(getComputedStyle(elB).fontSize);
    var m = Math.min(sa, sb).toFixed(2) + 'px';
    elA.style.fontSize = m; elB.style.fontSize = m;
    centerBar();
  }
  // 横線を、数値B（上）の文字の下端と数値A（下）の文字の上端のちょうど中間に置く
  var bar = document.querySelector('.frac-bar'), mcv = document.createElement('canvas').getContext('2d');
  function ink(el) {
    var cs = getComputedStyle(el), fs = parseFloat(cs.fontSize);
    mcv.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
    var m = mcv.measureText('0123456789');
    if (!m || m.actualBoundingBoxAscent === undefined || m.fontBoundingBoxAscent === undefined) return null;
    var asc = m.fontBoundingBoxAscent, desc = m.fontBoundingBoxDescent;
    var base = (fs - (asc + desc)) / 2 + asc; // line-height:1 のときのベースライン位置
    return { top: base - m.actualBoundingBoxAscent, bottom: base + m.actualBoundingBoxDescent };
  }
  function centerBar() {
    if (!bar) return;
    bar.style.transform = '';
    var ib = ink(elB), ia = ink(elA); if (!ib || !ia) return;
    var rb = elB.getBoundingClientRect(), ra = elA.getBoundingClientRect(), rr = bar.getBoundingClientRect();
    var gapTop = rr.top - (rb.top + ib.bottom), gapBot = (ra.top + ia.top) - rr.bottom;
    var d = (gapBot - gapTop) / 2;
    if (isFinite(d) && Math.abs(d) > 0.5) bar.style.transform = 'translateY(' + d.toFixed(1) + 'px)';
    // 「現在の当たり確率」を点線と数値Cの文字の上端の中間に置く
    var lab = document.querySelector('.label-sub'), dv = document.querySelector('.divider');
    if (lab && dv) {
      lab.style.transform = '';
      var ic = ink(elC);
      if (ic) {
        var rd = dv.getBoundingClientRect(), rc = elC.getBoundingClientRect(), rl = lab.getBoundingClientRect();
        var mid = (rd.bottom + rc.top + ic.top) / 2, cur = (rl.top + rl.bottom) / 2, dl = mid - cur;
        if (isFinite(dl) && Math.abs(dl) > 0.5) lab.style.transform = 'translateY(' + dl.toFixed(1) + 'px)';
      }
    }
  }
  var fr; window.addEventListener('resize', function () { clearTimeout(fr); fr = setTimeout(fitAll, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
  function render(changed) {
    elA.textContent = state.A;
    elB.textContent = state.B;
    var p = percentText(state.A, state.B);
    if (p === null) { elC.innerHTML = '—'; elC.classList.add('empty'); }
    else { elC.innerHTML = p + '<small>%</small>'; elC.classList.remove('empty'); }
    $('btnHit').disabled = state.B <= 0;
    $('btnMiss').disabled = state.A - state.B <= 0;
    fitAll();
    if (changed) { bump(elA); if (changed === 'hit') bump(elB); bump(elC); }
  }

  $('btnHit').addEventListener('click', function () {
    if (state.B <= 0) return;
    state.A--; state.B--; save(); render('hit');
  });
  $('btnMiss').addEventListener('click', function () {
    if (state.A - state.B <= 0) return;
    state.A--; save(); render('miss');
  });

  // リセット（登録した初期値に戻す）
  $('btnReset').addEventListener('click', function () {
    $('resetMsg').textContent = '登録時の状態（' + state.initB + ' / ' + state.initA + '）に戻します。よろしいですか？';
    $('confirmReset').hidden = false;
    $('resetNo').focus();
  });
  $('resetNo').addEventListener('click', function () { $('confirmReset').hidden = true; });
  $('resetYes').addEventListener('click', function () {
    state.A = state.initA; state.B = state.initB; save(); render('hit');
    $('confirmReset').hidden = true;
  });

  // 設定
  var inTotal = $('inTotal'), inWin = $('inWin'), err = $('formError');
  $('btnSettings').addEventListener('click', function () {
    inTotal.value = state.initA; inWin.value = state.initB; err.textContent = '';
    $('settings').hidden = false;
    inTotal.focus(); inTotal.select();
  });
  $('btnCancel').addEventListener('click', function () { $('settings').hidden = true; });
  $('settingsForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var a = Number(inTotal.value), b = Number(inWin.value);
    if (inTotal.value === '' || !Number.isInteger(a) || a < 1) { err.textContent = 'くじの全数は1以上の整数で入力してください。'; inTotal.focus(); return; }
    if (inWin.value === '' || !Number.isInteger(b) || b < 0) { err.textContent = '当たり数は0以上の整数で入力してください。'; inWin.focus(); return; }
    if (b > a) { err.textContent = '当たり数はくじの全数以下にしてください。'; inWin.focus(); return; }
    state = { A: a, B: b, initA: a, initB: b };
    save(); render('hit');
    $('settings').hidden = true;
  });


  render();
})();
</script>
<script>
(function () {
  var cv = document.getElementById('nightBg'); if (!cv || !cv.getContext) return;
  var ctx = cv.getContext('2d');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W, H, dpr, base, stars, bokeh, flick;
  function rnd(seed) { return function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
  function build() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    var r = rnd(20261012);
    base = document.createElement('canvas'); base.width = cv.width; base.height = cv.height;
    var b = base.getContext('2d'); b.scale(dpr, dpr);
    // 空
    var sky = b.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#070b1f'); sky.addColorStop(.45, '#141a42'); sky.addColorStop(.72, '#3a2358'); sky.addColorStop(.86, '#7a3a5e'); sky.addColorStop(1, '#2a1636');
    b.fillStyle = sky; b.fillRect(0, 0, W, H);
    // 地平線の街明かりの照り返し
    var glow = b.createRadialGradient(W * .5, H * .95, 0, W * .5, H * .95, W * .75);
    glow.addColorStop(0, 'rgba(255,190,110,.45)'); glow.addColorStop(.4, 'rgba(255,120,150,.18)'); glow.addColorStop(1, 'rgba(255,120,150,0)');
    b.fillStyle = glow; b.fillRect(0, 0, W, H);
    // 遠くの電波塔
    var tx = W * .63, ty = H * .38;
    b.fillStyle = '#1a1433'; b.beginPath(); b.moveTo(tx - 14, H); b.lineTo(tx - 3, ty); b.lineTo(tx + 3, ty); b.lineTo(tx + 14, H); b.fill();
    b.fillRect(tx - 1, ty - 40, 2, 40);
    flick = [{ x: tx, y: ty - 40, c: '255,80,80', s: 3, p: 0 }];
    // ビル群（奥→手前）
    var layers = [
      { top: .55, min: .08, max: .28, col: '#1d1840', win: .35, wa: .55 },
      { top: .62, min: .06, max: .26, col: '#140f2e', win: .45, wa: .8 },
      { top: .72, min: .04, max: .22, col: '#0a0819', win: .5, wa: 1 }
    ];
    var wins = ['255,214,140', '255,236,190', '255,180,110', '190,220,255', '255,160,200'];
    layers.forEach(function (L, li) {
      var x = -10;
      while (x < W + 10) {
        var bw = 26 + r() * (60 + li * 20);
        var bh = H * (L.min + r() * (L.max - L.min));
        var by = H * L.top + (H * (1 - L.top) - bh) * 0 - bh + H * (1 - L.top) * .2;
        by = Math.min(by, H * .9);
        b.fillStyle = L.col; b.fillRect(x, by, bw, H - by);
        if (r() < .25) { b.fillRect(x + bw * .4, by - 14, bw * .2, 14); }
        if (r() < .3) flick.push({ x: x + bw / 2, y: by - (r() < .5 ? 16 : 2), c: '255,70,70', s: 2, p: r() * 6 });
        // 窓
        var ws = 3 + li, gap = 4 + li;
        for (var wy = by + 6; wy < H - 4; wy += ws + gap) {
          for (var wx = x + 4; wx < x + bw - ws - 2; wx += ws + gap) {
            if (r() < L.win) {
              var c = wins[Math.floor(r() * wins.length)];
              b.fillStyle = 'rgba(' + c + ',' + (L.wa * (.35 + r() * .65)).toFixed(2) + ')';
              b.fillRect(wx, wy, ws, ws * 1.3);
              if (r() < .012) flick.push({ x: wx + ws / 2, y: wy + ws / 2, c: c, s: ws * 2.2, p: r() * 6, win: 1 });
            }
          }
        }
        x += bw + r() * 6;
      }
    });
    // 手前のもや
    var haze = b.createLinearGradient(0, H * .75, 0, H);
    haze.addColorStop(0, 'rgba(10,8,25,0)'); haze.addColorStop(1, 'rgba(10,8,25,.55)');
    b.fillStyle = haze; b.fillRect(0, H * .75, W, H * .25);
    // 星
    stars = [];
    for (var i = 0; i < 140; i++) stars.push({ x: r() * W, y: r() * H * .55, s: .4 + r() * 1.4, p: r() * 6.28, v: .6 + r() * 1.8 });
    // 光の玉（ボケ）
    bokeh = [];
    var bc = ['255,205,120', '255,150,190', '160,200,255', '255,235,180'];
    for (var j = 0; j < 26; j++) bokeh.push({ x: r() * W, y: H * (.35 + r() * .65), rad: 10 + r() * 38, c: bc[Math.floor(r() * bc.length)], a: .08 + r() * .16, vy: .08 + r() * .25, vx: (r() - .5) * .12, p: r() * 6.28 });
  }
  function frame(t) {
    var s = t / 1000;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(base, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // 星のまたたき
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i], a = .35 + .65 * Math.abs(Math.sin(s * st.v + st.p));
      ctx.fillStyle = 'rgba(255,250,235,' + a.toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(st.x, st.y, st.s, 0, 6.283); ctx.fill();
      if (st.s > 1.5 && a > .9) { ctx.fillRect(st.x - st.s * 3, st.y - .3, st.s * 6, .6); ctx.fillRect(st.x - .3, st.y - st.s * 3, .6, st.s * 6); }
    }
    // 航空障害灯・きらめく窓
    ctx.globalCompositeOperation = 'lighter';
    for (var k = 0; k < flick.length; k++) {
      var f = flick[k], fa = f.win ? .5 + .5 * Math.sin(s * 2 + f.p) : (Math.sin(s * 2.4 + f.p) > .3 ? 1 : .15);
      var g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.s * 3);
      g.addColorStop(0, 'rgba(' + f.c + ',' + (.9 * fa).toFixed(2) + ')'); g.addColorStop(1, 'rgba(' + f.c + ',0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, f.s * 3, 0, 6.283); ctx.fill();
    }
    // ボケ
    for (var j = 0; j < bokeh.length; j++) {
      var bo = bokeh[j];
      if (!reduce) { bo.y -= bo.vy; bo.x += bo.vx; if (bo.y < -bo.rad) { bo.y = H + bo.rad; } if (bo.x < -bo.rad) bo.x = W + bo.rad; if (bo.x > W + bo.rad) bo.x = -bo.rad; }
      var ba = bo.a * (.7 + .3 * Math.sin(s + bo.p));
      var gb = ctx.createRadialGradient(bo.x, bo.y, 0, bo.x, bo.y, bo.rad);
      gb.addColorStop(0, 'rgba(' + bo.c + ',' + ba.toFixed(3) + ')'); gb.addColorStop(.7, 'rgba(' + bo.c + ',' + (ba * .6).toFixed(3) + ')'); gb.addColorStop(1, 'rgba(' + bo.c + ',0)');
      ctx.fillStyle = gb; ctx.beginPath(); ctx.arc(bo.x, bo.y, bo.rad, 0, 6.283); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  var last = 0;
  function loop(t) { if (t - last > 33) { frame(t); last = t; } requestAnimationFrame(loop); }
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { build(); frame(performance.now()); }, 150); });
  build();
  if (reduce) frame(0); else requestAnimationFrame(loop);
})();
</script>
<script>
(function () {
  var el = document.getElementById('clock'); if (!el) return;
  var fmt = null;
  try { fmt = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }); } catch (e) {}
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function parts(d) {
    if (fmt && fmt.formatToParts) {
      var p = {}; fmt.formatToParts(d).forEach(function (x) { p[x.type] = x.value; });
      if (p.hour) return [pad(+p.hour % 24), pad(+p.minute), pad(+p.second)];
    }
    var j = new Date(d.getTime() + 9 * 3600000); // UTC+9（日本は夏時間なし）
    return [pad(j.getUTCHours()), pad(j.getUTCMinutes()), pad(j.getUTCSeconds())];
  }
  function tick() {
    var now = new Date(), t = parts(now);
    renderDate(now);
    el.innerHTML = '<span class="clock-t">' + t[0] + '<span class="colon">:</span>' + t[1] + '<span class="colon">:</span>' + t[2] + '</span>';
    if (!fitted) { fit(); fitted = true; }
    setTimeout(tick, 1000 - (now.getTime() % 1000) + 5);
  }
  var fitted = false;
  var dEl = document.getElementById('date'), lastD = '';
  var dfmt = null;
  try { dfmt = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: 'numeric', day: 'numeric' }); } catch (e) {}
  function renderDate(d) {
    if (!dEl) return;
    var y, mo, da;
    var j = new Date(d.getTime() + 9 * 3600000); // UTC+9
    if (dfmt && dfmt.formatToParts) { var p = {}; dfmt.formatToParts(d).forEach(function (x) { p[x.type] = x.value; }); y = +p.year; mo = +p.month; da = +p.day; }
    if (!y) { y = j.getUTCFullYear(); mo = j.getUTCMonth() + 1; da = j.getUTCDate(); }
    var key = y + '-' + mo + '-' + da; if (key === lastD) return; lastD = key;
    var w = new Date(Date.UTC(y, mo - 1, da)).getUTCDay();
    var wn = '日月火水木金土'.charAt(w), cls = w === 0 ? ' sun' : (w === 6 ? ' sat' : '');
    dEl.innerHTML = '<span class="date-t">' + y + '年' + mo + '月' + da + '日<span class="wd' + cls + '">(' + wn + ')</span></span>';
    fitDate();
  }
  function fitDate() {
    if (!dEl) return; var t = dEl.querySelector('.date-t'); if (!t) return;
    dEl.style.fontSize = '';
    var size = parseFloat(getComputedStyle(dEl).fontSize), avail = dEl.clientWidth, need = t.getBoundingClientRect().width;
    if (need > avail * 0.94) dEl.style.fontSize = (size * avail * 0.94 / need).toFixed(2) + 'px';
  }
  window.addEventListener('resize', function () { setTimeout(fitDate, 130); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitDate);
  // 枠の幅に収まるよう文字サイズを自動調整（フォントの読み込み後・画面サイズ変更時にも再調整）
  function fit() {
    var t = el.querySelector('.clock-t'); if (!t) return;
    el.style.fontSize = '';
    var cs = getComputedStyle(el);
    var size = parseFloat(cs.fontSize);
    var avail = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var need = t.getBoundingClientRect().width;
    if (need > 0 && need > avail * 0.92) el.style.fontSize = (size * avail * 0.92 / need).toFixed(2) + 'px';
  }
  var ft; window.addEventListener('resize', function () { clearTimeout(ft); ft = setTimeout(fit, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  setInterval(fit, 60000);
  tick();
})();
</script>
