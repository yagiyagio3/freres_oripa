<title>くじ当たりボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@500;700;800&display=swap">
<style>
/* Layout: 横向き3分割 — 左ロゴ / 中央 分数ボード / 右 操作ボタン。縁日の福引台を思わせる藍と金。 */
:root {
  --bg: #16213a;          /* 藍 */
  --bg-deep: #0f1729;
  --panel: #fbf6ea;       /* 生成りの札 */
  --ink: #1b2440;
  --gold: #e3b450;
  --hit: #d8452f;         /* 当たり：朱 */
  --miss: #3f5a8a;        /* ハズレ：群青 */
  --muted: #8f9bb8;
  --line: rgba(227,180,80,.35);
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "M PLUS 1p", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 90% at 50% 40%, var(--bg) 0%, var(--bg-deep) 100%);
  background-color: var(--bg);
  color: var(--panel);
  font-family: var(--font-body);
  padding-inline: 16px;
  overflow: hidden;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: minmax(0, 1fr);
  align-items: center;
  box-sizing: border-box;
  gap: clamp(12px, 2.5vw, 32px);
  padding-block: clamp(12px, 3vh, 32px);
}

/* 左：ロゴ */
.logo {
  display: grid; place-items: center;
  height: 100%;
}
.logo-img {
  width: min(92%, 70vh);
  max-width: 100%;
  aspect-ratio: 1;
  object-fit: contain;
  filter: drop-shadow(0 10px 24px rgba(0,0,0,.45));
  -webkit-user-drag: none;
}
.logo-stage {
  position: relative;
  width: min(92%, 70vh);
  max-width: 100%;
  aspect-ratio: 1;
  filter: drop-shadow(0 10px 24px rgba(0,0,0,.45));
  -webkit-user-drag: none;
  pointer-events: none;
}
.logo-stage img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ls-clip { position: absolute; inset: 0; clip-path: circle(49.9% at 50% 50%); -webkit-clip-path: circle(49.9% at 50% 50%); overflow: hidden; }
.ls-bg { transform: scale(1.06); }
.ls-shine {
  position: absolute; inset: 0;
  background: linear-gradient(115deg, rgba(255,240,190,0) 42%, rgba(255,244,205,.55) 50%, rgba(255,240,190,0) 58%);
  background-size: 300% 100%;
  background-position: 120% 0;
  mix-blend-mode: screen;
}
.ls-star { position: absolute; width: 7%; aspect-ratio: 1; opacity: 0; }
.ls-star svg { width: 100%; height: 100%; display: block; }
.ls-star.s1 { left: 12%; top: 22%; }
.ls-star.s2 { left: 84%; top: 36%; width: 9%; }
.ls-star.s3 { left: 6%;  top: 62%; width: 5%; }
.ls-star.s4 { left: 72%; top: 17%; width: 5%; }

.switch[aria-checked="true"] .sw-off { opacity: 0; }
.switch:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* 時計：枠をなくして文字を大きく。濃紺のフチと影で夜景の上でも読みやすく */
.clock {
  border: none !important; background: none !important; padding: 0 !important; border-radius: 0;
  font-size: clamp(30px, min(9vw, 13vh), 120px);
  line-height: 1.05; letter-spacing: .03em;
  text-shadow: 3.0px 0.0px 0 #0a0f26, 2.6px 1.5px 0 #0a0f26, 1.5px 2.6px 0 #0a0f26, 0.0px 3.0px 0 #0a0f26, -1.5px 2.6px 0 #0a0f26, -2.6px 1.5px 0 #0a0f26, -3.0px 0.0px 0 #0a0f26, -2.6px -1.5px 0 #0a0f26, -1.5px -2.6px 0 #0a0f26, -0.0px -3.0px 0 #0a0f26, 1.5px -2.6px 0 #0a0f26, 2.6px -1.5px 0 #0a0f26, 0 4px 10px rgba(5,8,22,.9), 0 0 18px rgba(5,8,22,.8);
  overflow: visible;
}

/* 時計の数字を縦に1.5倍に伸ばす（伸びた分の上下の余白も確保） */
.clock { padding-top: .3em !important; padding-bottom: .42em !important; margin-top: calc(-1 * clamp(4px, 1.2vh, 12px)); }
.clock-t { transform: scaleY(1.8); transform-origin: 50% 50%; }

/* ロゴ3（店長）：金の円が画像の中で小さめなので、円の位置に合わせて切り抜く。カードを持つ手は円からはみ出すので円の外に置く */
.logo-c .ls-clip { inset: auto; left: 4.807%; top: 3.620%; width: 90.307%; height: 90.307%; }
.logo-c .ls-clip > .ls-bg, .logo-c .ls-clip > .ls-shine, .logo-c .ls-clip > .ls-char { inset: auto; left: -5.323%; top: -4.009%; width: 110.733%; height: 110.733%; }
.logo-c .ls-hand { transform-origin: 26.25% 65%; }
.logo-c .ls-clip > .ls-bg { max-width: none; max-height: none; }
.radios { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
</style>

<script>
(function () {
  var KEY = 'kuji-board-v1';
  // 初期値はサンプル（設定ボタンから変更してください）
  var state = { A: 100, B: 10, initA: 100, initB: 10 };

  try {
    var saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && Number.isInteger(saved.A) && Number.isInteger(saved.B)) state = saved;
  } catch (e) {}

  if (!Array.isArray(state.hist)) state.hist = [];
  // 「1つ戻す」用の履歴（直前の残数・当たり数を最大300件まで保存）
  function push() { state.hist.push([state.A, state.B]); if (state.hist.length > 300) state.hist.shift(); }

  var $ = function (id) { return document.getElementById(id); };
  var elA = $('numA'), elB = $('numB'), elC = $('numC');

  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function percentText(a, b) {
    if (a <= 0) return null;
    // 小数第2位を四捨五入して第1位まで
    var v = Math.round((b / a) * 1000) / 10;
    return v.toFixed(1);
  }

  function bump(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

  // 数値が枠の幅からはみ出す場合だけ縮小する
  var board = document.querySelector('.board');
  function fitOne(target, row) {
    target.style.fontSize = '';
    var cs = getComputedStyle(board);
    var avail = board.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var rg = document.createRange(); rg.selectNodeContents(row);
    var need = rg.getBoundingClientRect().width;
    if (need > avail * 0.96) {
      var size = parseFloat(getComputedStyle(target).fontSize);
      target.style.fontSize = (size * avail * 0.96 / need).toFixed(2) + 'px';
    }
  }
  function fitAll() {
    // 数値Aと数値Bは常に同じサイズ（はみ出す方に合わせて両方縮小）
    fitOne(elB, elB.parentNode); fitOne(elA, elA.parentNode); fitOne(elC, elC);
    var sa = parseFloat(getComputedStyle(elA).fontSize), sb = parseFloat(getComputedStyle(elB).fontSize);
    var m = Math.min(sa, sb).toFixed(2) + 'px';
    elA.style.fontSize = m; elB.style.fontSize = m;
    centerBar();
  }
  // 横線を、数値B（上）の文字の下端と数値A（下）の文字の上端のちょうど中間に置く
  var bar = document.querySelector('.frac-bar'), mcv = document.createElement('canvas').getContext('2d');
  function ink(el) {
    var cs = getComputedStyle(el), fs = parseFloat(cs.fontSize);
    mcv.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
    var m = mcv.measureText('0123456789');
    if (!m || m.actualBoundingBoxAscent === undefined || m.fontBoundingBoxAscent === undefined) return null;
    var asc = m.fontBoundingBoxAscent, desc = m.fontBoundingBoxDescent;
    var base = (fs - (asc + desc)) / 2 + asc; // line-height:1 のときのベースライン位置
    return { top: base - m.actualBoundingBoxAscent, bottom: base + m.actualBoundingBoxDescent };
  }
  function centerBar() {
    if (!bar) return;
    bar.style.transform = '';
    var ib = ink(elB), ia = ink(elA); if (!ib || !ia) return;
    var rb = elB.getBoundingClientRect(), ra = elA.getBoundingClientRect(), rr = bar.getBoundingClientRect();
    var gapTop = rr.top - (rb.top + ib.bottom), gapBot = (ra.top + ia.top) - rr.bottom;
    var d = (gapBot - gapTop) / 2;
    if (isFinite(d) && Math.abs(d) > 0.5) bar.style.transform = 'translateY(' + d.toFixed(1) + 'px)';
    // 「現在の当たり確率」を点線と数値Cの文字の上端の中間に置く
    var lab = document.querySelector('.label-sub'), dv = document.querySelector('.divider');
    if (lab && dv) {
      lab.style.transform = '';
      var ic = ink(elC);
      if (ic) {
        var rd = dv.getBoundingClientRect(), rc = elC.getBoundingClientRect(), rl = lab.getBoundingClientRect();
        var mid = (rd.bottom + rc.top + ic.top) / 2, cur = (rl.top + rl.bottom) / 2, dl = mid - cur;
        if (isFinite(dl) && Math.abs(dl) > 0.5) lab.style.transform = 'translateY(' + dl.toFixed(1) + 'px)';
      }
    }
  }
  var fr; window.addEventListener('resize', function () { clearTimeout(fr); fr = setTimeout(fitAll, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
  var lastFit = '';

    elA.textContent = state.A;
    elB.textContent = state.B;
    var p = percentText(state.A, state.B);
    if (p === null) { elC.innerHTML = '—'; elC.classList.add('empty'); }
    else { elC.innerHTML = p + '<small>%</small>'; elC.classList.remove('empty'); }

    $('btnMiss').disabled = state.A - state.B <= 0;
    $('btnUndo').disabled = !state.hist.length;

    var fk = String(state.A).length + ',' + String(state.B).length + ',' + elC.textContent.length;

  $('btnHit').addEventListener('click', function () {

    push(); state.A--; state.B--; save(); render('hit');
  });

    state.A = state.initA; state.B = state.initB; state.hist = []; save(); render('hit');
    $('confirmReset').hidden = true;

  // 設定（入力はiPadのキーボードを使わず、画面内の数字キーで行う）

  var fTotal = $('fTotal'), fWin = $('fWin');
  var vals = { total: '', win: '' }, active = 'total', fresh = true;
  // ロゴの選択（'a'=フレリア、'b'=はまちゃん）を端末内に保存
  var LOGO_KEY = 'kuji-board-logo';
  var logo = 'a', pick = 'a';
  try { var lg = localStorage.getItem(LOGO_KEY); if (lg === 'a' || lg === 'b' || lg === 'c') logo = lg; } catch (e) {}
  function applyLogo() { $('logoA').hidden = logo !== 'a'; $('logoB').hidden = logo !== 'b'; $('logoC').hidden = logo !== 'c'; }
  applyLogo();
  function showPick() {
    $('logoBtnA').setAttribute('aria-checked', pick === 'a' ? 'true' : 'false');
    $('logoBtnB').setAttribute('aria-checked', pick === 'b' ? 'true' : 'false');
    $('logoBtnC').setAttribute('aria-checked', pick === 'c' ? 'true' : 'false');
  }
  $('logoBtnA').addEventListener('click', function () { pick = 'a'; showPick(); });
  $('logoBtnB').addEventListener('click', function () { pick = 'b'; showPick(); });
  $('logoBtnC').addEventListener('click', function () { pick = 'c'; showPick(); });
  function showFields() {
    fTotal.querySelector('.nv').textContent = vals.total;
    fWin.querySelector('.nv').textContent = vals.win;
    fTotal.classList.toggle('active', active === 'total'); fWin.classList.toggle('active', active === 'win');
    fTotal.classList.toggle('fresh', active === 'total' && fresh); fWin.classList.toggle('fresh', active === 'win' && fresh);
  }
  function select(k) { active = k; fresh = true; err.textContent = ''; showFields(); }
  fTotal.addEventListener('click', function () { select('total'); });
  fWin.addEventListener('click', function () { select('win'); });
  function press(k) {
    var v = vals[active];
    if (k === 'clear') v = '';
    else if (k === 'back') v = fresh ? '' : v.slice(0, -1);
    else { if (fresh || v === '0') v = ''; if (v.length < 6) v += k; }
    fresh = false; vals[active] = v; err.textContent = ''; showFields();
  }
  Array.prototype.forEach.call(document.querySelectorAll('#keypad .key'), function (b) {
    b.addEventListener('click', function () { press(b.getAttribute('data-k')); });
  });
  // 外付けキーボードがある場合はキー入力も使える
  document.addEventListener('keydown', function (e) {
    if ($('settings').hidden) return;
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); press(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); press('back'); }
    else if (e.key === 'Delete') { e.preventDefault(); press('clear'); }
    else if (e.key === 'Tab') { e.preventDefault(); select(active === 'total' ? 'win' : 'total'); }
    else if (e.key === 'Enter') { e.preventDefault(); doRegister(); }
    else if (e.key === 'Escape') { $('settings').hidden = true; }
  });
  // スイングムーヴ（左側の上下の動き）のON/OFF。初期値はON、端末内に保存
  var SWING_KEY = 'kuji-board-swing';
  var swing = true, pickSwing = true;
  try { if (localStorage.getItem(SWING_KEY) === 'off') swing = false; } catch (e) {}
  window.kujiSwingOn = swing;
  function showSwing() { $('swingSwitch').setAttribute('aria-checked', pickSwing ? 'true' : 'false'); }
  $('swingSwitch').addEventListener('click', function () { pickSwing = !pickSwing; showSwing(); });
  $('btnSettings').addEventListener('click', function () {
    pick = logo; showPick();
    pickSwing = swing; showSwing();
    vals.total = String(state.initA); vals.win = String(state.initB); err.textContent = '';
    select('total');
    $('settings').hidden = false;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  });
  $('btnCancel').addEventListener('click', function () { $('settings').hidden = true; });
  $('btnOk').addEventListener('click', function (e) { e.preventDefault(); doRegister(); });
  function doRegister() {
    var a = Number(vals.total), b = Number(vals.win);
    if (vals.total === '' || !Number.isInteger(a) || a < 1) { err.textContent = 'くじの全数は1以上の整数で入力してください。'; select('total'); return; }
    if (vals.win === '' || !Number.isInteger(b) || b < 0) { err.textContent = '当たり数は0以上の整数で入力してください。'; select('win'); err.textContent = '当たり数は0以上の整数で入力してください。'; return; }
    if (b > a) { select('win'); err.textContent = '当たり数はくじの全数以下にしてください。'; return; }
    state = { A: a, B: b, initA: a, initB: b, hist: [] };
    logo = pick;
    swing = pickSwing; window.kujiSwingOn = swing;
    try { localStorage.setItem(SWING_KEY, swing ? 'on' : 'off'); } catch (e) {}
    if (window.kujiSetSwing) window.kujiSetSwing(swing);
    try { localStorage.setItem(LOGO_KEY, logo); } catch (e) {}
    applyLogo();
    save(); render('hit');
    $('settings').hidden = true;
  }


  render();
})();
</script>
<script>
(function () {
  // 夜景背景（軽量版）：動かない部分（空・ビル・窓）は1回だけ描き、

    glow.addColorStop(0, 'rgba(255,190,110,.45)'); glow.addColorStop(.4, 'rgba(255,120,150,.18)'); glow.addColorStop(1, 'rgba(255,120,150,0)');
    b.fillStyle = glow; b.fillRect(0, 0, W, H);
    var tx = W * .63, ty = H * .38;
    b.fillStyle = '#1a1433'; b.beginPath(); b.moveTo(tx - 14, H); b.lineTo(tx - 3, ty); b.lineTo(tx + 3, ty); b.lineTo(tx + 14, H); b.fill();
    b.fillRect(tx - 1, ty - 40, 2, 40);

      { top: .55, min: .08, max: .28, col: '#1d1840', win: .35, wa: .55 },
      { top: .62, min: .06, max: .26, col: '#140f2e', win: .45, wa: .8 },
      { top: .72, min: .04, max: .22, col: '#0a0819', win: .5, wa: 1 }
    ];
    var wins = ['255,214,140', '255,236,190', '255,180,110', '190,220,255', '255,160,200'];
    layers.forEach(function (L, li) {

      var o = bokeh[j];
      if (!reduce) { o.y -= o.vy; o.x += o.vx; if (o.y < -o.rad) o.y = H + o.rad; if (o.x < -o.rad) o.x = W + o.rad; if (o.x > W + o.rad) o.x = -o.rad; }

  }

  var STEP = document.documentElement.classList.contains('lite') ? 66 : 50; // Androidは約15コマ/秒、その他は約20コマ/秒
  function loop(t) { if (running && t - last > STEP) { frame(t); last = t; } requestAnimationFrame(loop); }

  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { ready = false; build(); frame(performance.now()); }, 200); });
  build();
  if (reduce) frame(0); else requestAnimationFrame(loop);
})();
</script>
<script>
(function () {
  var el = document.getElementById('clock'); if (!el) return;
  var fmt = null;
  try { fmt = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }); } catch (e) {}

    }
    var j = new Date(d.getTime() + 9 * 3600000); // UTC+9（日本は夏時間なし）
    return [pad(j.getUTCHours()), pad(j.getUTCMinutes()), pad(j.getUTCSeconds())];
  }
  function tick() {
    var now = new Date(), t = parts(now);
    renderDate(now);
    el.innerHTML = '<span class="clock-t">' + t[0] + '<span class="colon">:</span>' + t[1] + '<span class="colon">:</span>' + t[2] + '</span>';
    if (!fitted) { fit(); fitted = true; }
    setTimeout(tick, 1000 - (now.getTime() % 1000) + 5);
  }
  var fitted = false;
  var dEl = document.getElementById('date'), lastD = '';
  var dfmt = null;
  try { dfmt = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: 'numeric', day: 'numeric' }); } catch (e) {}
  function renderDate(d) {
    if (!dEl) return;
    var y, mo, da;
    var j = new Date(d.getTime() + 9 * 3600000); // UTC+9
    if (dfmt && dfmt.formatToParts) { var p = {}; dfmt.formatToParts(d).forEach(function (x) { p[x.type] = x.value; }); y = +p.year; mo = +p.month; da = +p.day; }
    if (!y) { y = j.getUTCFullYear(); mo = j.getUTCMonth() + 1; da = j.getUTCDate(); }
    var key = y + '-' + mo + '-' + da; if (key === lastD) return; lastD = key;
    var w = new Date(Date.UTC(y, mo - 1, da)).getUTCDay();
    var wn = '日月火水木金土'.charAt(w), cls = w === 0 ? ' sun' : (w === 6 ? ' sat' : '');
    dEl.innerHTML = '<span class="date-t">' + y + '年' + mo + '月' + da + '日<span class="wd' + cls + '">(' + wn + ')</span></span>';
    fitDate();
  }
  function fitDate() {
    if (!dEl) return; var t = dEl.querySelector('.date-t'); if (!t) return;
    dEl.style.fontSize = '';
    var size = parseFloat(getComputedStyle(dEl).fontSize), avail = dEl.clientWidth, need = t.getBoundingClientRect().width;
    if (need > avail * 0.94) dEl.style.fontSize = (size * avail * 0.94 / need).toFixed(2) + 'px';
  }
  window.addEventListener('resize', function () { setTimeout(fitDate, 130); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitDate);
  // 枠の幅に収まるよう文字サイズを自動調整（フォントの読み込み後・画面サイズ変更時にも再調整）
  function fit() {
    var t = el.querySelector('.clock-t'); if (!t) return;
    el.style.fontSize = '';
    var cs = getComputedStyle(el);
    var size = parseFloat(cs.fontSize);
    var avail = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var need = t.getBoundingClientRect().width;
    if (need > 0 && need > avail * 0.97) el.style.fontSize = (size * avail * 0.97 / need).toFixed(2) + 'px';
  }
  var ft; window.addEventListener('resize', function () { clearTimeout(ft); ft = setTimeout(fit, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  setInterval(fit, 60000);
  tick();
})();
</script>
<script>
(function () {
  var VER = '2026-11-11d';
  var v = document.getElementById('verInfo');
  function upd() {
    if (!v) return;
    var w = window.innerWidth, h = window.innerHeight;
    v.textContent = 'バージョン ' + VER + '　／　画面 ' + w + '×' + h + '（比 ' + (w / h).toFixed(2) + '）';
    // 1行に収まらないときは文字を小さくする
    v.style.fontSize = '';
    requestAnimationFrame(function () {
      var fs = parseFloat(getComputedStyle(v).fontSize);
      if (v.scrollWidth > v.clientWidth && v.clientWidth > 0) v.style.fontSize = Math.max(7, fs * v.clientWidth / v.scrollWidth * 0.98).toFixed(2) + 'px';
    });
  }
  upd(); window.addEventListener('resize', upd);
  document.getElementById('btnSettings').addEventListener('click', upd);
  // 起動のたびに最新版を取りに行く仕組み（GitHub Pages 上でのみ有効）
  try {
    if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window.self) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  } catch (e) {}
})();
</script>
<script>
(function () {
  // キーボードが出たら、設定ウィンドウを見えている範囲（キーボードの上）に収める
  var vv = window.visualViewport; if (!vv) return;
  var ovs = [document.getElementById('settings'), document.getElementById('confirmReset')];
  function fit() {
    var kb = window.innerHeight - vv.height > 80; // キーボード表示中
    ovs.forEach(function (o) {
      if (!o) return;
      if (kb) { o.style.top = vv.offsetTop + 'px'; o.style.height = vv.height + 'px'; o.style.bottom = 'auto'; o.style.alignItems = 'start'; o.style.overflow = 'auto'; }
      else { o.style.top = ''; o.style.height = ''; o.style.bottom = ''; o.style.alignItems = ''; o.style.overflow = ''; }
    });
  }
  vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit);
})();
</script>
<script>
(function () {
  // 左側の上下の動きを、画面の上端・下端の近くまで届く幅に自動で合わせる
  var col = document.querySelector('.logo'); if (!col) return;
  var MARGIN = 6; // 画面の端に残す余白（px）
  var anim = null, lastAmp = -1;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function calc() {
    var ty = 0;
    try { var tf = getComputedStyle(col).transform; if (tf && tf !== 'none') ty = new DOMMatrix(tf).m42; } catch (e) {}
    if (anim) { anim.pause(); }
    try { var tf2 = getComputedStyle(col).transform; ty = (tf2 && tf2 !== 'none') ? new DOMMatrix(tf2).m42 : 0; } catch (e) {}
    var top = Infinity, bottom = -Infinity;
    Array.prototype.forEach.call(col.children, function (el) {
      if (el.hidden || !el.offsetHeight) return;
      var r = el.getBoundingClientRect(); top = Math.min(top, r.top); bottom = Math.max(bottom, r.bottom);
    });
    if (!isFinite(top)) return;
    top -= ty; bottom -= ty; // 動いていないときの位置
    var amp = Math.max(0, Math.min(top - MARGIN, window.innerHeight - bottom - MARGIN));
    amp = Math.round(amp);
    if (window.kujiSwingOn === false) { if (anim) { anim.cancel(); anim = null; } lastAmp = -1; return; }
    if (amp === lastAmp) { if (anim) anim.play(); return; } lastAmp = amp;
    // 移動はWeb Animationsで行う（端末の描画専用の仕組みで動くので、処理が重くなりにくい）
    if (anim) anim.cancel();
    if (reduce || !col.animate) return;
    anim = col.animate([{ transform: 'translate3d(0,' + (-amp) + 'px,0)' }, { transform: 'translate3d(0,' + amp + 'px,0)' }],
      { duration: 3000, easing: 'ease-in-out', iterations: Infinity, direction: 'alternate' });
  }
  var t; function later() { clearTimeout(t); t = setTimeout(calc, 200); }
  window.addEventListener('resize', later);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
  document.getElementById('btnOk').addEventListener('click', later); // ロゴを切り替えたとき
  window.kujiSetSwing = function (on) { if (anim) { anim.cancel(); anim = null; } lastAmp = -1; calc(); };
  calc(); setTimeout(calc, 800);
})();
</script>
