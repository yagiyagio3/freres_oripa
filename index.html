<title>くじ当たりボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@500;700;800&display=swap">
<style>
/* Layout: 横向き3分割 — 左ロゴ / 中央 分数ボード / 右 操作ボタン。縁日の福引台を思わせる藍と金。 */
:root {
  --bg: #16213a;          /* 藍 */
  --bg-deep: #0f1729;
  --panel: #fbf6ea;       /* 生成りの札 */
  --ink: #1b2440;
  --gold: #e3b450;
  --hit: #d8452f;         /* 当たり：朱 */
  --miss: #3f5a8a;        /* ハズレ：群青 */
  --muted: #8f9bb8;
  --line: rgba(227,180,80,.35);
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "M PLUS 1p", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 90% at 50% 40%, var(--bg) 0%, var(--bg-deep) 100%);
  background-color: var(--bg);
  color: var(--panel);
  font-family: var(--font-body);
  padding-inline: 16px;
  overflow: hidden;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: minmax(0, 1fr);
  align-items: center;
  box-sizing: border-box;
  gap: clamp(12px, 2.5vw, 32px);
  padding-block: clamp(12px, 3vh, 32px);
}

/* 左：ロゴ */
.logo {
  display: grid; place-items: center;
  height: 100%;
}
.logo-img {
  width: min(92%, 70vh);
  max-width: 100%;
  aspect-ratio: 1;
  object-fit: contain;
  filter: drop-shadow(0 10px 24px rgba(0,0,0,.45));
  -webkit-user-drag: none;
}
.logo-dummy {
  width: min(80%, 34vh);
  aspect-ratio: 1; max-width: 100%;
  border: 3px dashed var(--line);
  border-radius: 50%;
  display: grid; place-items: center; align-content: center;
  gap: .4em;
  color: var(--gold);
  text-align: center;
}
.logo-dummy b { font-family: var(--font-display); font-size: clamp(22px, 4vw, 48px); font-weight: 400; letter-spacing: .08em; }
.logo-dummy small { color: var(--muted); font-size: clamp(10px, 1.2vw, 14px); letter-spacing: .1em; }

/* 中央：ボード */
.board {
  background: var(--panel);
  color: var(--ink);
  border-radius: 18px;
  border: 4px solid var(--gold);
  box-shadow: 0 0 0 6px var(--bg-deep), 0 0 0 8px var(--line), 0 20px 40px rgba(0,0,0,.4);
  padding: clamp(10px, 3vh, 32px) clamp(12px, 2vw, 28px);
  max-height: 100%; box-sizing: border-box; overflow: hidden;
  display: grid;
  grid-template-rows: auto auto auto;
  gap: clamp(8px, 2vh, 20px);
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.label {
  font-size: clamp(10px, 1.3vw, 15px);
  font-weight: 800;
  letter-spacing: .14em;
  color: #6a6f80;
}
.fraction { display: grid; justify-items: center; gap: clamp(2px, .6vh, 8px); }
.frac-row { display: flex; align-items: baseline; justify-content: center; gap: .35em; }
.frac-num, .frac-den {
  font-family: var(--font-display);
  line-height: 1;
}
.frac-num { font-size: clamp(30px, min(7.5vw, 14vh), 104px); color: var(--hit); }
.frac-den { font-size: clamp(24px, min(5.5vw, 10vh), 76px); }
.frac-unit { font-size: clamp(11px, 1.4vw, 17px); font-weight: 700; color: #6a6f80; }
.frac-bar { width: 70%; height: 5px; border-radius: 3px; background: var(--ink); }
.divider { height: 0; border-top: 2px dotted #d6cdb4; }
.percent {
  font-family: var(--font-display);
  font-size: clamp(32px, min(8vw, 15vh), 112px);
  line-height: 1;
}
.percent small { font-size: .45em; margin-left: .08em; }
.percent.empty { color: #b9b3a3; }

/* 右：ボタン */
.controls {
  display: grid;
  grid-template-rows: auto 1.4fr 1.4fr 1fr 1fr;
  gap: clamp(6px, 1.8vh, 16px);
  height: 100%;
  max-height: 100%;
  min-height: 0;
}
.controls > .btn { min-height: 0; }
.topbar { display: flex; justify-content: flex-end; }
.btn-full {
  display: inline-flex; align-items: center; gap: 4px;
  font: 700 12px var(--font-body); letter-spacing: .04em;
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 10px;
  cursor: pointer;
}
.btn-full svg { width: 14px; height: 14px; }
.btn-full:active { background: rgba(255,255,255,.08); }
.btn-full:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.toast {
  position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  max-width: calc(100% - 32px);
  background: var(--panel); color: var(--ink);
  border: 2px solid var(--gold); border-radius: 10px;
  padding: 8px 14px; font-size: 13px; font-weight: 700;
  z-index: 15;
}
.btn {
  font-family: var(--font-display);
  font-size: clamp(16px, min(3.4vw, 6vh), 40px);
  letter-spacing: .12em;
  border: none;
  border-radius: 14px;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 6px 0 rgba(0,0,0,.35);
  transition: transform .06s, box-shadow .06s, opacity .15s;
}
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn-hit { background: var(--hit); }
.btn-miss { background: var(--miss); }
.btn-sub {
  font-size: clamp(13px, min(2.2vw, 4vh), 26px);
  background: transparent;
  color: var(--panel);
  border: 2px solid var(--line);
  box-shadow: none;
}
.btn-sub:active { background: rgba(255,255,255,.06); }
.btn-gear { color: var(--gold); border-color: var(--gold); }

/* 設定ポップアップ */
.overlay {
  position: fixed; inset: 0;
  background: rgba(8,12,24,.7);
  display: grid; place-items: center;
  padding: 16px;
  z-index: 10;
}
.dialog {
  background: var(--panel); color: var(--ink);
  border-radius: 16px; border: 3px solid var(--gold);
  width: min(340px, 100%);
  box-sizing: border-box;
  max-height: 100%; overflow: auto;
  padding: clamp(14px, 2.5vh, 22px) 20px;
  display: grid; gap: 12px;
}
.dialog h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 20px; letter-spacing: .08em; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-weight: 800; font-size: 14px; }
.field input {
  width: 100%; min-width: 0; box-sizing: border-box;
  font: 700 20px var(--font-body);
  font-variant-numeric: tabular-nums;
  padding: 8px 12px;
  border: 2px solid #cfc6ad; border-radius: 10px;
  background: #fff; color: var(--ink);
  -webkit-user-select: text; user-select: text;
}
.field input:focus { outline: none; border-color: var(--hit); }
.error { color: var(--hit); font-size: 14px; font-weight: 700; min-height: 1.2em; margin: 0; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dbtn {
  min-width: 0; box-sizing: border-box;
  font: 800 15px var(--font-body); letter-spacing: .06em;
  padding: 9px 8px; border-radius: 8px; cursor: pointer;
}
.dbtn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.dbtn-cancel { background: transparent; border: 2px solid #b8b09a; color: var(--ink); }
.dbtn-ok { background: var(--ink); border: 2px solid var(--ink); color: #fff; }
.dbtn-full { background: var(--gold); border: 2px solid var(--gold); color: var(--ink); width: 100%; }
.note { margin: -4px 0 0; font-size: 13px; line-height: 1.5; color: #5b6075; }

/* 確認ポップアップ（リセット） */
.dialog p.msg { margin: 0; font-size: 16px; line-height: 1.6; }

/* 縦向き警告 */
.rotate {
  display: none;
  position: fixed; inset: 0; z-index: 20;
  background: var(--bg-deep);
  place-items: center; align-content: center;
  gap: 20px; text-align: center; padding: 24px;
}
.rotate svg { width: 96px; height: 96px; }
.rotate p { margin: 0; font-family: var(--font-display); font-size: clamp(20px, 5vw, 32px); color: var(--panel); letter-spacing: .06em; }
.rotate small { color: var(--muted); font-size: 15px; }
@media (orientation: portrait) {
  .rotate { display: grid; }
}
@media (prefers-reduced-motion: no-preference) {
  .rotate svg { animation: tilt 2.4s ease-in-out infinite; }
  @keyframes tilt { 0%,30% { transform: rotate(0) } 60%,100% { transform: rotate(-90deg) } }
  .bump { animation: bump .25s ease-out; }
  @keyframes bump { 0% { transform: scale(1.12) } 100% { transform: scale(1) } }
}
</style>
</head>

  var KEY = 'kuji-board-v1';
  // 初期値はサンプル（設定ボタンから変更してください）
  var state = { A: 100, B: 10, initA: 100, initB: 10 };

  try {
    var saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && Number.isInteger(saved.A) && Number.isInteger(saved.B)) state = saved;
  } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };
  var elA = $('numA'), elB = $('numB'), elC = $('numC');

  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function percentText(a, b) {
    if (a <= 0) return null;
    // 小数第2位を四捨五入して第1位まで
    var v = Math.round((b / a) * 1000) / 10;
    return v.toFixed(1);
  }

  function bump(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

  function render(changed) {
    elA.textContent = state.A;
    elB.textContent = state.B;
    var p = percentText(state.A, state.B);
    if (p === null) { elC.innerHTML = '—'; elC.classList.add('empty'); }
    else { elC.innerHTML = p + '<small>%</small>'; elC.classList.remove('empty'); }
    $('btnHit').disabled = state.B <= 0;
    $('btnMiss').disabled = state.A - state.B <= 0;
    if (changed) { bump(elA); if (changed === 'hit') bump(elB); bump(elC); }
  }

  $('btnHit').addEventListener('click', function () {
    if (state.B <= 0) return;
    state.A--; state.B--; save(); render('hit');
  });
  $('btnMiss').addEventListener('click', function () {
    if (state.A - state.B <= 0) return;
    state.A--; save(); render('miss');
  });

  // リセット（登録した初期値に戻す）
  $('btnReset').addEventListener('click', function () {
    $('resetMsg').textContent = '登録時の状態（' + state.initB + ' / ' + state.initA + '）に戻します。よろしいですか？';
    $('confirmReset').hidden = false;
    $('resetNo').focus();
  });
  $('resetNo').addEventListener('click', function () { $('confirmReset').hidden = true; });
  $('resetYes').addEventListener('click', function () {
    state.A = state.initA; state.B = state.initB; save(); render('hit');
    $('confirmReset').hidden = true;
  });

  // 設定
  var inTotal = $('inTotal'), inWin = $('inWin'), err = $('formError');
  $('btnSettings').addEventListener('click', function () {
    inTotal.value = state.initA; inWin.value = state.initB; err.textContent = '';
    $('settings').hidden = false;
    inTotal.focus(); inTotal.select();
  });
  $('btnCancel').addEventListener('click', function () { $('settings').hidden = true; });
  $('settingsForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var a = Number(inTotal.value), b = Number(inWin.value);
    if (inTotal.value === '' || !Number.isInteger(a) || a < 1) { err.textContent = 'くじの全数は1以上の整数で入力してください。'; inTotal.focus(); return; }
    if (inWin.value === '' || !Number.isInteger(b) || b < 0) { err.textContent = '当たり数は0以上の整数で入力してください。'; inWin.focus(); return; }
    if (b > a) { err.textContent = '当たり数はくじの全数以下にしてください。'; inWin.focus(); return; }
    state = { A: a, B: b, initA: a, initB: b };
    save(); render('hit');
    $('settings').hidden = true;
  });

  // 全画面表示（Safari / Chrome 両対応：標準API と webkit 版の両方を試す）
  var btnFull = $('btnFull'), fullLabel = $('fullLabel');
  var toast = document.createElement('div'); toast.className = 'toast'; toast.hidden = true; document.body.appendChild(toast);
  var toastTimer;
  function fsElement() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
  function updateFullBtn() { fullLabel.textContent = fsElement() ? '解除' : '全画面'; }
  function showFullNote(msg) {
    toast.textContent = msg; toast.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toast.hidden = true; }, 3500);
  }
  btnFull.addEventListener('click', function () {
    var el = document.documentElement;
    try {
      if (fsElement()) {
        var exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) { var r = exit.call(document); if (r && r.catch) r.catch(function(){}); }
        return;
      }
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!req) { showFullNote('このブラウザでは全画面表示が使えません。'); return; }
      var p = req.call(el);
      if (p && p.then) {
        p.then(updateFullBtn)
         .catch(function () { showFullNote('この表示環境では全画面が許可されませんでした。'); });
      } else {
        setTimeout(function () {
          if (fsElement()) updateFullBtn();
          else showFullNote('この表示環境では全画面が許可されませんでした。');
        }, 400);
      }
    } catch (e) { showFullNote('この表示環境では全画面が許可されませんでした。'); }
  });
  document.addEventListener('fullscreenchange', updateFullBtn);
  document.addEventListener('webkitfullscreenchange', updateFullBtn);

  render();
})();
</script>

</body>
</html>
